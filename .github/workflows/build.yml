# Builds the video image and pushes it to ghcr.io on every push to main
# (plus a manual Run button). No secrets needed: GITHUB_TOKEN pushes to
# this same repo's packages. If the push fails with "denied", go to the
# repo's Settings -> Actions -> General -> Workflow permissions and pick
# "Read and write permissions", then re-run.
#
# PLACEMENT: in the GitHub repo this file must live at exactly:
#   .github/workflows/build.yml
# (It is stored here under a plain name because dot-folders are not allowed
# in this project's src/ tree. When you "Create new file" on GitHub, type
# the path above as the filename and paste this content.)
name: build-push

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/jamesjimmyjamjones/qween-video:v1
          
